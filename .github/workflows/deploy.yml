name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen-und-veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Buildnummer in die Version stempeln
        run: |
          BUILD="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA::7}"
          sed -i -E "s|^export const BUILD = '.*';|export const BUILD = '${BUILD} · ${SHA}';|" assets/js/version.js
          sed -i -E "s|\"build\": \".*\"|\"build\": \"${BUILD} · ${SHA}\"|" version.json
          # Der Service-Worker-Cache bekommt die Buildnummer, damit jeder Push
          # zuverlässig als neue Version ausgeliefert wird.
          sed -i -E "s|^const VERSION = '([0-9.]+)'.*|const VERSION = '\1+${BUILD}';|" sw.js
          echo "--- version.js ---"; cat assets/js/version.js
          echo "--- sw.js (Kopf) ---"; head -12 sw.js

      # enablement: true schaltet GitHub Pages beim ersten Lauf selbst frei –
      # dadurch entfaellt der Handgriff unter Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
